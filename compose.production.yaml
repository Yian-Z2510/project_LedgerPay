services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-internal

  webhook-receiver:
    image: ghcr.io/yian-z2510/ledgerpay-webhook-receiver:${IMAGE_TAG:?Set IMAGE_TAG to the full Git commit SHA}
    restart: unless-stopped
    networks:
      - app-internal

  backend:
    image: ghcr.io/yian-z2510/ledgerpay-backend:${IMAGE_TAG:?Set IMAGE_TAG to the full Git commit SHA}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      webhook-receiver:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-internal

  frontend:
    image: ghcr.io/yian-z2510/ledgerpay-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the full Git commit SHA}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge
      - app-internal

networks:
  edge:
  app-internal:
    internal: true

volumes:
  postgres-data:
