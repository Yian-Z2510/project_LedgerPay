map "$request_method:$uri" $ledgerpay_merchant_creation_key {
    default                         "";
    "POST:/api/v1/merchants"       $binary_remote_addr;
}

limit_req_zone $ledgerpay_merchant_creation_key
    zone=ledgerpay_merchant_creation:10m
    rate=5r/m;

limit_req zone=ledgerpay_merchant_creation burst=3 nodelay;
limit_req_status 429;
