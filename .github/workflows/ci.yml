name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerpay_ci
          POSTGRES_USER: ledgerpay_ci
          POSTGRES_PASSWORD: ledgerpay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ledgerpay_ci -d ledgerpay_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/ledgerpay_ci
      DB_USERNAME: ledgerpay_ci
      DB_PASSWORD: ledgerpay_ci_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

  compose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file .env.production.example
          --file compose.production.yaml
          config --quiet

      - name: Validate deployment script syntax
        run: bash -n deploy/deploy-production.sh deploy/cleanup-demo-data.sh

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - frontend-validation
      - compose-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ledgerpay-backend
            context: .
            dockerfile: Dockerfile
            build_args: ""
          - image: ledgerpay-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: VITE_LEDGERPAY_WEBHOOK_URL=http://webhook-receiver:9000/webhook
          - image: ledgerpay-webhook-receiver
            context: scripts
            dockerfile: scripts/Dockerfile.webhook-receiver
            build_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yian-z2510/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://ledgerpay.yianz.me
    concurrency:
      group: ledgerpay-production-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-1
      EC2_INSTANCE_ID: i-06eb52b897477b786

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send production deployment command
        id: send_command
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy LedgerPay ${GITHUB_SHA}" \
            --parameters "commands=[\"sudo -H -u ubuntu bash /opt/ledgerpay/deploy-production.sh '${GITHUB_SHA}'\"]" \
            --query 'Command.CommandId' \
            --output text)"

          if [[ ! "$command_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "AWS SSM did not return a valid command ID." >&2
            exit 1
          fi

          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and show result
        shell: bash
        run: |
          set -euo pipefail
          command_id="${{ steps.send_command.outputs.command_id }}"
          terminal_status=""

          for _ in {1..150}; do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed)
                terminal_status="$status"
                break
                ;;
              Pending|InProgress|Delayed|Cancelling|"")
                sleep 10
                ;;
              *)
                echo "Unexpected AWS SSM status: ${status}" >&2
                exit 1
                ;;
            esac
          done

          echo "AWS SSM deployment status: ${terminal_status:-polling-timeout}"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true

          if [[ "$terminal_status" != "Success" ]]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text >&2 || true
            exit 1
          fi
