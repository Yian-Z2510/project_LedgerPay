name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerpay_ci
          POSTGRES_USER: ledgerpay_ci
          POSTGRES_PASSWORD: ledgerpay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ledgerpay_ci -d ledgerpay_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/ledgerpay_ci
      DB_USERNAME: ledgerpay_ci
      DB_PASSWORD: ledgerpay_ci_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw test
